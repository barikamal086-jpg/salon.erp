<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixa360 - Dashboard de Faturamento</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Axios para requisições HTTP -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
  <!-- Design System Override (deve vir DEPOIS do Tailwind para ter prioridade) -->
  <link rel="stylesheet" href="css/design-system.css">

  <style>
    :root {
      /* Primary Brand Color - Dark Professional Blue */
      --primary: #1E40AF;
      --primary-dark: #1E40AF;
      --secondary: #64748B;
      --accent: #F59E0B;

      /* Business Logic Status Colors */
      --success: #16A34A;        /* Green for Receita/Income */
      --warning: #F59E0B;
      --error: #DC2626;          /* Red for Despesa/Expenses */
      --info: #1D4ED8;           /* Medium Blue for Neutral/Net */

      /* Restaurant/Channel Colors */
      --salao: #16A34A;          /* Green */
      --ifood: #DC2626;          /* Red */
      --keeta: #6B7280;          /* Gray */
      --99food: #F59E0B;         /* Amber */

      /* Backgrounds */
      --bg-primary: #FFFFFF;
      --bg-base: #F8FAFC;        /* Light gray background */
      --bg-secondary: #F8FAFC;
      --bg-dark: #1E293B;

      /* Semantic Light Backgrounds */
      --bg-success: rgba(22, 163, 74, 0.1);     /* Light green */
      --bg-error: rgba(220, 38, 38, 0.1);       /* Light red */
      --bg-info: rgba(29, 78, 216, 0.1);        /* Light blue */
      --bg-primary-light: rgba(30, 64, 175, 0.1);

      /* Text Colors */
      --text-primary: #0F172A;   /* Dark blue-black text */
      --text-secondary: #64748B; /* Medium gray text */

      /* Borders */
      --border: #E2E8F0;         /* Light gray borders */
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--secondary);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    body {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div id="app" class="flex h-screen">
    <!-- LOGIN SCREEN -->
    <div v-if="!isAuthenticated" class="w-full flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100">
      <div class="bg-white rounded-lg shadow-2xl p-8 w-96">
        <div style="text-align: center; margin-bottom: 32px;">
          <svg width="80" height="40" viewBox="0 0 120 60" style="margin: 0 auto 16px; display: block;">
            <g>
              <path d="M 20 30 Q 25 20 35 20 Q 45 20 50 30 Q 45 40 35 40 Q 25 40 20 30" fill="none" stroke="var(--info)" stroke-width="3" stroke-linecap="round"/>
              <path d="M 50 30 Q 55 20 65 20 Q 75 20 80 30 Q 75 40 65 40 Q 55 40 50 30" fill="none" stroke="var(--info)" stroke-width="3" stroke-linecap="round"/>
              <g transform="translate(68, 22)"><polygon points="0,0 5,8 10,0 7,4 12,4 12,2 7,2" fill="var(--accent)"/></g>
            </g>
          </svg>
          <h1 style="font-size: 28px; font-weight: 700; color: var(--text-primary); margin: 0;">Caixa360</h1>
          <p style="color: var(--text-secondary); margin-top: 4px;">Bem-vindo de volta!</p>
        </div>

        <form @submit.prevent="fazerLogin">
          <div class="mb-4">
            <label style="display: block; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Email</label>
            <input v-model="loginForm.email" type="email" placeholder="seu@email.com"
              style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;">
          </div>

          <div class="mb-6">
            <label style="display: block; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Senha</label>
            <input v-model="loginForm.senha" type="password" placeholder="••••••••"
              style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;">
          </div>

          <button type="submit" :disabled="loginLoading"
            style="width: 100%; padding: 12px; background: linear-gradient(135deg, var(--info) 0%, var(--primary) 100%); color: white; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <svg v-if="!loginLoading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path>
              <polyline points="9 10 12 13 15 10"></polyline>
            </svg>
            <svg v-else width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;">
              <line x1="12" y1="2" x2="12" y2="6"></line>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="4.22" y1="4.22" x2="7.34" y2="7.34"></line>
              <line x1="16.66" y1="16.66" x2="19.78" y2="19.78"></line>
              <line x1="2" y1="12" x2="6" y2="12"></line>
              <line x1="18" y1="12" x2="22" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="7.34" y2="16.66"></line>
              <line x1="16.66" y1="7.34" x2="19.78" y2="4.22"></line>
            </svg>
            {{ loginLoading ? 'Entrando...' : 'Entrar' }}
          </button>

          <div v-if="loginError" style="margin-top: 12px; padding: 12px; background: var(--bg-error); color: #7F1D1D; border-radius: 6px; font-size: 14px;">
            ❌ {{ loginError }}
          </div>
        </form>

        <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border);">
          <p style="color: var(--text-secondary); font-size: 13px; text-align: center; margin: 0;">
            <strong>Demo - Credenciais dos Sócios:</strong><br>
            younes@kaia.com / younes123<br>
            bruno@kaia.com / bruno123<br>
            kamal@kaia.com / kamal123
          </p>
        </div>
      </div>
    </div>

    <!-- APP MAIN -->
    <template v-else>
    <!-- Sidebar -->
    <aside class="w-64" style="background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15); position: fixed; height: 100vh; overflow-y: auto;">
      <!-- Logo -->
      <div style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center;">
        <img src="assets/logo-caixa360.jpg" alt="Caixa360" style="max-width: 100%; height: auto; border-radius: 8px;">
      </div>

      <!-- Menu -->
      <nav style="padding: 16px; space: 8px;">
        <div
          @click="activeView = 'dashboard'"
          :class="activeView === 'dashboard' ? '' : 'opacity-80 hover:opacity-100'"
          style="padding: 12px 16px; border-radius: 8px; color: white; cursor: pointer; transition: all 0.2s; margin-bottom: 8px;"
          :style="activeView === 'dashboard' ? 'background: rgba(255,255,255,0.15); border-left: 4px solid white; padding-left: 12px;' : ''"
        >
          <i class="fas fa-chart-line mr-2"></i> Visão Geral
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 overflow-auto">
      <!-- Top Bar -->
      <div style="background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-bottom: 1px solid var(--border);">
        <div style="width: 100%; padding: 32px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; box-sizing: border-box;">
          <h2 style="font-size: 1.5rem; font-weight: 700; color: #000000 !important;">
            Visão Geral
          </h2>
          <div style="display: flex; align-items: center; gap: 8px;">
            <a
              href="#secao-lancar-receita-despesa"
              @click.prevent="irParaLancarReceitaDespesa"
              style="font-size: 1rem; font-weight: 700; color: #000000; text-decoration: none; padding: 8px 14px; border-radius: 6px; transition: background 0.2s; white-space: nowrap;"
              onmouseover="this.style.background='var(--bg-secondary)'"
              onmouseout="this.style.background='transparent'"
            >
              Lançar Receita/Despesa
            </a>
            <a
              href="#secao-processar-notas-fiscais"
              @click.prevent="irParaProcessarNotasFiscais"
              style="font-size: 1rem; font-weight: 700; color: #000000; text-decoration: none; padding: 8px 14px; border-radius: 6px; transition: background 0.2s; white-space: nowrap;"
              onmouseover="this.style.background='var(--bg-secondary)'"
              onmouseout="this.style.background='transparent'"
            >
              Processar Notas Fiscais
            </a>
            <a
              href="#secao-fluxo-caixa"
              @click.prevent="irParaFluxoCaixa"
              style="font-size: 1rem; font-weight: 700; color: #000000; text-decoration: none; padding: 8px 14px; border-radius: 6px; transition: background 0.2s; white-space: nowrap;"
              onmouseover="this.style.background='var(--bg-secondary)'"
              onmouseout="this.style.background='transparent'"
            >
              Fluxo de Caixa
            </a>
            <a
              href="#secao-despesas-por-foto"
              @click.prevent="irParaDespesasPorFoto"
              style="font-size: 1rem; font-weight: 700; color: #000000; text-decoration: none; padding: 8px 14px; border-radius: 6px; transition: background 0.2s; white-space: nowrap;"
              onmouseover="this.style.background='var(--bg-secondary)'"
              onmouseout="this.style.background='transparent'"
            >
              Despesas por foto (IA)
            </a>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div v-show="activeView === 'dashboard'" class="p-8 space-y-6">

        <!-- Seletor de Período (Dropdown) -->
        <div style="background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; border: 1px solid var(--border);">
          <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text-primary); margin-bottom: 16px;">Selecione o Período</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: flex-start;">
            <!-- Dropdown Menu (como Conta Azul) -->
            <div>
              <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Competência</label>
              <select
                v-model="periodo.filtroPreset"
                @change="aplicarFiltroPreset"
                style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit; background: white; cursor: pointer;"
              >
                <option value="hoje">Hoje</option>
                <option value="semana">Esta semana</option>
                <option value="mes">Este mês</option>
                <option value="ano">Este ano</option>
                <option value="ultimos30" selected>Últimos 30 dias</option>
                <option value="ultimos12">Últimos 12 meses</option>
                <option value="todo">Todo o período</option>
                <option value="customizado">Personalizado</option>
              </select>
            </div>

            <!-- Buscar no período selecionado -->
            <div>
              <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Pesquisar no período selecionado</label>
              <input
                type="text"
                placeholder="Buscar..."
                style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit;"
              >
            </div>

            <!-- Mostrar apenas quando "Personalizado" está selecionado -->
            <div v-if="periodo.filtroPreset === 'customizado'">
              <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Data Início</label>
              <input
                v-model="periodo.dataInicio"
                type="date"
                @change="atualizarPeriodo"
                style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit;"
              >
            </div>

            <div v-if="periodo.filtroPreset === 'customizado'">
              <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Data Fim</label>
              <input
                v-model="periodo.dataFim"
                type="date"
                @change="atualizarPeriodo"
                style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit;"
              >
            </div>

            <!-- Mostrar período atual selecionado -->
            <div style="grid-column: span 2; padding: 12px; background: var(--bg-secondary); border-radius: 6px; font-size: 0.9rem; color: var(--text-secondary);">
              Período: <strong style="color: var(--text-primary);">{{ periodo.dataInicio }}</strong> a <strong style="color: var(--text-primary);">{{ periodo.dataFim }}</strong>
            </div>
          </div>
        </div>

        <!-- KPIs Gerais -->
        <div style="background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; border: 1px solid var(--border);">
          <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text-primary); margin-bottom: 24px;">Indicadores de Performance</h3>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
            <!-- Receita -->
            <div style="border-radius: 8px; padding: 20px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: none; border-left: 3px solid var(--success); transition: all 0.2s;" @mouseenter="$event.currentTarget.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)'" @mouseleave="$event.currentTarget.style.boxShadow = '0 2px 8px rgba(0,0,0,0.06)'">
              <p style="color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; margin-bottom: 12px; margin: 0; margin-bottom: 12px;">Total Receita</p>
              <p style="font-size: 2rem; font-weight: 800; color: var(--success); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">R$ {{ formatarValor(stats.totalReceita) }}</p>
            </div>
            <!-- Despesa -->
            <div style="border-radius: 8px; padding: 20px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: none; border-left: 3px solid var(--error); transition: all 0.2s;" @mouseenter="$event.currentTarget.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)'" @mouseleave="$event.currentTarget.style.boxShadow = '0 2px 8px rgba(0,0,0,0.06)'">
              <p style="color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; margin-bottom: 12px; margin: 0; margin-bottom: 12px;">Total Despesa</p>
              <p style="font-size: 2rem; font-weight: 800; color: var(--error); margin: 0;">R$ {{ formatarValor(stats.totalDespesa) }}</p>
            </div>
            <!-- Líquido -->
            <div style="border-radius: 8px; padding: 20px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: none; border-left: 3px solid var(--success); transition: all 0.2s;" @mouseenter="$event.currentTarget.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)'" @mouseleave="$event.currentTarget.style.boxShadow = '0 2px 8px rgba(0,0,0,0.06)'">
              <p style="color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; margin-bottom: 12px; margin: 0; margin-bottom: 12px;">Total Líquido</p>
              <p style="font-size: 2rem; font-weight: 800; color: var(--success); margin: 0;">R$ {{ formatarValor(stats.totalLiquido) }}</p>
            </div>
          </div>
        </div>

        <!-- KPIs por Categoria -->
        <div style="background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; border: 1px solid var(--border);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text-primary); margin: 0;">Performance por Categoria</h3>
            <div style="display: flex; gap: 8px; align-items: center;">
              <label style="font-size: 0.9rem; font-weight: 600; color: var(--text-primary);">Filtrar:</label>
              <select v-model="filtroCategoria" @change="atualizarFiltroCategoria" style="padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit; min-width: 150px;">
                <option value="">Todas</option>
                <option value="Salão">Salão</option>
                <option value="iFood Loja 1">iFood Loja 1</option>
                <option value="iFood Loja 2">iFood Loja 2</option>
                <option value="99Food Loja 1">99Food Loja 1</option>
                <option value="99Food Loja 2">99Food Loja 2</option>
                <option value="Keeta">Keeta</option>
              </select>
            </div>
          </div>
          <div v-if="categoriasFiltradas.length > 0" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
            <div
              v-for="cat in categoriasFiltradas"
              :key="cat.categoria"
              style="border-radius: 8px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: none; border-left: 4px solid; overflow: hidden; transition: all 0.2s;"
              :style="{
                'border-left-color': cat.categoria === 'Salão' ? 'var(--salao)' :
                                   cat.categoria === 'iFood' ? 'var(--ifood)' :
                                   cat.categoria === '99Food' ? '#F5D400' :
                                   cat.categoria === 'Keeta' ? '#00CDAC' : 'var(--primary)'
              }"
              @mouseenter="$event.currentTarget.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)'"
              @mouseleave="$event.currentTarget.style.boxShadow = '0 2px 8px rgba(0,0,0,0.06)'"
            >
              <!-- Cabeçalho com nome do canal -->
              <div :style="{
                'background': cat.categoria === 'Salão' ? '#166534' :
                            cat.categoria === 'iFood' ? '#991B1B' :
                            cat.categoria === '99Food' ? '#F5D400' :
                            cat.categoria === 'Keeta' ? '#00CDAC' : 'var(--primary)',
                'color': (cat.categoria === '99Food' || cat.categoria === 'Keeta') ? '#000000' : 'white',
                'padding': '16px',
                'font-size': '1.1rem',
                'font-weight': '700'
              }">
                {{ cat.categoria }}
              </div>

              <!-- Conteúdo do card -->
              <div style="padding: 16px;">
                <!-- Receita -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                  <span style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">Receita</span>
                  <span style="font-size: 1rem; font-weight: 700; color: var(--success);">R$ {{ formatarValor(cat.totalReceita) }}</span>
                </div>

                <!-- Divisor -->
                <div style="height: 1px; background: var(--border); margin-bottom: 12px;"></div>

                <!-- Para iFood, Keeta, 99Food: mostrar Taxas -->
                <template v-if="cat.categoria !== 'Salão'">
                  <!-- Taxa Plataforma com Badge -->
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <span style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">Taxa</span>
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <span style="font-size: 0.9rem; font-weight: 700; color: #F59E0B;">R$ {{ formatarValor(cat.totalTaxas || 0) }}</span>
                      <span style="background: #FEF3C7; color: #92400E; padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700;">{{ cat.percentualTaxas || '0.00' }}%</span>
                    </div>
                  </div>

                  <!-- Despesas Alocadas -->
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <span style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">Despesa</span>
                    <span style="font-size: 0.9rem; font-weight: 700;" :style="{ color: (cat.totalDespesasAlocadas || 0) === 0 ? '#9CA3AF' : 'var(--error)' }">R$ {{ formatarValor(cat.totalDespesasAlocadas || 0) }}</span>
                  </div>
                </template>

                <!-- Para Salão: mostrar apenas Despesa Total -->
                <template v-else>
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <span style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">Despesa</span>
                    <span style="font-size: 0.9rem; font-weight: 700;" :style="{ color: cat.totalDespesa === 0 ? '#9CA3AF' : 'var(--error)' }">R$ {{ formatarValor(cat.totalDespesa) }}</span>
                  </div>
                </template>

                <!-- Divisor -->
                <div style="height: 1px; background: var(--border); margin-bottom: 12px;"></div>

                <!-- Líquido em destaque -->
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0;">
                  <span style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 600;">Líquido</span>
                  <span style="font-size: 1.5rem; font-weight: 800; color: var(--info);">
                    R$ {{
                      formatarValor(
                        (parseFloat(cat.totalReceita) || 0) -
                        (parseFloat(cat.totalTaxas) || 0) -
                        (cat.categoria !== 'Salão' ? parseFloat(cat.totalDespesasAlocadas) || 0 : parseFloat(cat.totalDespesa) || 0)
                      )
                    }}
                  </span>
                </div>
              </div>

              <!-- Rodapé com informações adicionais -->
              <div style="font-size: 0.75rem; color: var(--text-secondary); padding: 12px 16px; background: var(--bg-base); border-top: 1px solid var(--border);">
                <div>{{ cat?.dias || 0 }} {{ (cat?.dias || 0) === 1 ? 'dia' : 'dias' }}</div>
                <div v-if="cat?.mediaReceita > 0">Média: R$ {{ formatarValor(cat.mediaReceita) }}/dia</div>
              </div>
            </div>
          </div>
          <div v-else style="color: var(--text-secondary); text-align: center; padding: 32px 0;">
            Nenhuma receita/despesa neste período
          </div>
        </div>

        <!-- Gráfico Mensal - INLINE -->
        <div style="background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; border: 1px solid var(--border);">
          <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text-primary); margin-bottom: 16px;">Despesas por Categoria</h3>
          <div style="margin-bottom: 24px; padding: 16px; background: var(--bg-secondary); border-radius: 8px; border: 1px solid var(--border);">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
              <div>
                <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Mês</label>
                <select v-model="graficoMes" @change="renderizarGraficoMensal" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit;">
                  <option value="01">Janeiro</option>
                  <option value="02">Fevereiro</option>
                  <option value="03">Março</option>
                  <option value="04">Abril</option>
                  <option value="05">Maio</option>
                  <option value="06">Junho</option>
                  <option value="07">Julho</option>
                  <option value="08">Agosto</option>
                  <option value="09">Setembro</option>
                  <option value="10">Outubro</option>
                  <option value="11">Novembro</option>
                  <option value="12">Dezembro</option>
                </select>
              </div>
              <div>
                <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Ano</label>
                <input v-model.number="graficoAno" type="number" @change="renderizarGraficoMensal" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit;">
              </div>
            </div>
          </div>
          <div style="max-width: 420px; margin: 0 auto;">
            <canvas id="graficoMensalInline"></canvas>
          </div>
        </div>

        <!-- Fluxo de Caixa: despesas realizadas + previstas (por vencimento) ao longo do mês -->
        <div id="secao-fluxo-caixa" style="background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; border: 1px solid var(--border); scroll-margin-top: 24px;">
          <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text-primary); margin-bottom: 16px;">Fluxo de Caixa</h3>
          <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: -12px; margin-bottom: 16px;">
            Despesas já lançadas (realizado) + notas fiscais pendentes na data de vencimento (previsto).
          </p>

          <div style="margin-bottom: 24px; padding: 16px; background: var(--bg-secondary); border-radius: 8px; border: 1px solid var(--border);">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
              <div>
                <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Mês</label>
                <select v-model="fluxoCaixaMes" @change="carregarFluxoCaixa" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit;">
                  <option value="01">Janeiro</option>
                  <option value="02">Fevereiro</option>
                  <option value="03">Março</option>
                  <option value="04">Abril</option>
                  <option value="05">Maio</option>
                  <option value="06">Junho</option>
                  <option value="07">Julho</option>
                  <option value="08">Agosto</option>
                  <option value="09">Setembro</option>
                  <option value="10">Outubro</option>
                  <option value="11">Novembro</option>
                  <option value="12">Dezembro</option>
                </select>
              </div>
              <div>
                <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Ano</label>
                <input v-model.number="fluxoCaixaAno" type="number" @change="carregarFluxoCaixa" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit;">
              </div>
            </div>
            <div style="margin-top: 16px; padding: 12px; background: white; border-radius: 6px; font-size: 0.85rem; color: var(--text-secondary);">
              Período deste card: <strong style="color: var(--text-primary);">{{ fluxoCaixaPeriodoLabel }}</strong> (mês calendário completo — independente do filtro "Selecione o Período" lá em cima, por isso os totais podem ser diferentes)
            </div>
          </div>

          <!-- Resumo -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
            <div style="border-radius: 8px; padding: 16px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 3px solid var(--error);">
              <p style="color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; margin: 0 0 8px 0;">Realizado</p>
              <p style="font-size: 1.5rem; font-weight: 800; color: var(--error); margin: 0;">R$ {{ formatarValor(fluxoCaixaDados.resumo.totalRealizado) }}</p>
              <p style="font-size: 0.75rem; color: var(--text-secondary); margin: 4px 0 0 0;">{{ fluxoCaixaDados.resumo.qtdRealizado }} lançamento(s)</p>
            </div>
            <div style="border-radius: 8px; padding: 16px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 3px solid #991B1B;">
              <p style="color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; margin: 0 0 8px 0;">🔴 Vencido (não pago)</p>
              <p style="font-size: 1.5rem; font-weight: 800; color: #991B1B; margin: 0;">R$ {{ formatarValor(fluxoCaixaDados.resumo.totalVencido) }}</p>
              <p style="font-size: 0.75rem; color: var(--text-secondary); margin: 4px 0 0 0;">{{ fluxoCaixaDados.resumo.qtdVencido }} nota(s) já venceu</p>
            </div>
            <div style="border-radius: 8px; padding: 16px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 3px solid var(--warning);">
              <p style="color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; margin: 0 0 8px 0;">🟡 A Vencer</p>
              <p style="font-size: 1.5rem; font-weight: 800; color: var(--warning); margin: 0;">R$ {{ formatarValor(fluxoCaixaDados.resumo.totalAVencer) }}</p>
              <p style="font-size: 0.75rem; color: var(--text-secondary); margin: 4px 0 0 0;">{{ fluxoCaixaDados.resumo.qtdAVencer }} nota(s) ainda no prazo</p>
            </div>
            <div style="border-radius: 8px; padding: 16px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 3px solid var(--text-primary);">
              <p style="color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; margin: 0 0 8px 0;">Total do Mês</p>
              <p style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin: 0;">R$ {{ formatarValor(fluxoCaixaDados.resumo.totalGeral) }}</p>
            </div>
          </div>

          <div class="w-full" style="margin-bottom: 24px;">
            <canvas id="graficoFluxoCaixa" height="80"></canvas>
          </div>

          <!-- Tabela detalhada -->
          <div v-if="fluxoCaixaDados.detalhes.length > 0" style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.875rem;">
              <thead style="background: var(--bg-secondary);">
                <tr>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border);">Data</th>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border);">Categoria</th>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border);">Fornecedor / NF</th>
                  <th style="padding: 10px 12px; text-align: right; font-weight: 600; border-bottom: 2px solid var(--border);">Valor</th>
                  <th style="padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border);">Status</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="item in fluxoCaixaDados.detalhes" :key="item.origem + '-' + item.id" style="border-bottom: 1px solid var(--border);">
                  <td style="padding: 10px 12px;">{{ item.data?.split('-').reverse().join('/') }}</td>
                  <td style="padding: 10px 12px;">
                    {{ item.subcategoria || item.categoria || '—' }}
                    <span v-if="item.classificacao" style="color: var(--text-secondary); font-size: 0.8rem;">({{ item.classificacao }})</span>
                  </td>
                  <td style="padding: 10px 12px; color: var(--text-secondary);">
                    {{ item.fornecedor_nome || '—' }}
                    <span v-if="item.numero_nf" style="font-size: 0.8rem;">· NF {{ item.numero_nf }}</span>
                  </td>
                  <td style="padding: 10px 12px; text-align: right; font-weight: 600;">R$ {{ formatarValor(item.valor) }}</td>
                  <td style="padding: 10px 12px;">
                    <span v-if="item.status === 'realizado'"
                          style="display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; background: var(--bg-error); color: var(--error);">
                      Realizado
                    </span>
                    <span v-else-if="item.vencimentoStatus === 'vencido'"
                          style="display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; background: rgba(153, 27, 27, 0.1); color: #991B1B;">
                      🔴 Vencido
                    </span>
                    <span v-else
                          style="display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; background: rgba(245, 158, 11, 0.1); color: var(--warning);">
                      🟡 A vencer
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-else style="text-align: center; padding: 24px; color: var(--text-secondary);">
            Nenhuma despesa realizada ou pendente encontrada nesse período.
          </div>
        </div>

        <!-- Formulário + Tabela -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Formulário -->
          <div id="secao-lancar-receita-despesa" style="background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; border: 1px solid var(--border); scroll-margin-top: 24px;">
            <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text-primary); margin-bottom: 16px;">📝 Lançar Receita/Despesa</h3>
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Tipo</label>
                <select v-model="novaReceita.tipo" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="receita">Receita</option>
                  <option value="despesa">Despesa</option>
                </select>
              </div>

              <!-- Campos específicos para DESPESA -->
              <div v-if="novaReceita.tipo === 'despesa'" class="border-l-4 border-orange-500 bg-orange-50 p-4 rounded">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Classificação da Despesa</label>
                  <select v-model="novaReceita.classificacao" @change="atualizarSubcategorias" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Selecione classificação...</option>
                    <option value="CMV">🔴 CMV (Custo de Mercadoria)</option>
                    <option value="Operacional">⚪ Operacional</option>
                    <option value="Administrativa">🟡 Administrativa</option>
                    <option value="Financeira">🟣 Financeira</option>
                  </select>
                </div>

                <div v-if="novaReceita.classificacao" class="mt-3">
                  <label class="block text-sm font-medium text-gray-700 mb-2">Subcategoria</label>
                  <select v-model="novaReceita.tipoDespesaId" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option :value="null">Selecione subcategoria...</option>
                    <option v-for="tipo in subcategoriasDisponiveis" :key="tipo.id" :value="tipo.id">
                      {{ tipo.subcategoria }}
                    </option>
                  </select>
                  <button
                    @click="abrirModalNovaCategoria"
                    type="button"
                    class="mt-2 text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Adicionar nova categoria
                  </button>
                </div>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Data</label>
                <input v-model="novaReceita.data" type="date" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Total (R$)</label>
                <input
                  v-model="novaReceita.total"
                  type="text"
                  placeholder="0,00"
                  @blur="formatarValorInput"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">{{ novaReceita.tipo === 'receita' ? 'Categoria' : 'Local/Origem' }}</label>
                <select v-model="novaReceita.categoria" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">Selecione uma categoria...</option>
                  <option v-for="cat in categoriasDisponiveis" :key="cat" :value="cat">
                    {{ cat }}
                  </option>
                  <option value="outra">Outra (especificar)</option>
                </select>
              </div>
              <div v-if="novaReceita.categoria === 'outra'">
                <label class="block text-sm font-medium text-gray-700 mb-2">Informe a {{ novaReceita.tipo === 'receita' ? 'categoria' : 'origem' }}</label>
                <input v-model="outraCategoria" type="text" :placeholder="novaReceita.tipo === 'receita' ? 'Ex: Marketplace X' : 'Ex: Fornecedor Y'" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
              </div>
              <button @click="salvarReceita" style="width: 100%; background: var(--primary); color: white; padding: 12px; border-radius: 6px; border: none; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;"
                @mouseenter="$event.target.style.background = 'var(--primary-dark)'"
                @mouseleave="$event.target.style.background = 'var(--primary)'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                  <polyline points="17 21 17 13 7 13 7 21"></polyline>
                  <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                Salvar
              </button>
            </div>
          </div>

          <!-- NOTAS FISCAIS - Upload e Processamento -->
          <div id="secao-processar-notas-fiscais" class="lg:col-span-2 bg-white rounded-lg shadow-md p-6" style="scroll-margin-top: 24px;">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-bold text-gray-900">📄 Processar Notas Fiscais</h3>
            </div>

            <!-- Upload Drag-and-Drop -->
            <div class="mb-6">
              <div
                @drop.prevent="handleDropFiles"
                @dragover.prevent="isDraggingFiles = true"
                @dragleave="isDraggingFiles = false"
                :class="['border-2 border-dashed rounded-lg p-8 text-center transition-all',
                  isDraggingFiles ? 'border-blue-500 bg-blue-50' : 'border-gray-300 bg-gray-50']">
                <input
                  type="file"
                  multiple
                  accept=".xml,.pdf"
                  @change="handleSelectFiles"
                  ref="fileInput"
                  class="hidden"
                  id="notasFiscaisInput">

                  <div class="text-4xl mb-2">📦</div>
                  <p class="text-gray-700 font-semibold">Arraste arquivos aqui ou clique para selecionar</p>

                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                Selecionar Arquivos
              </button>

                  @change="selecionarArquivoContaAzul"

                  @click="$refs.contaAzulFileInput.click()"
                  class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium text-sm flex items-center justify-center gap-2">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                  </svg>
                  Selecionar Excel
                </button>
                <button
                  @click="importarContaAzulDashboard"
                  :disabled="!arquivoContaAzul || importandoContaAzul"
                  class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium text-sm disabled:bg-gray-400 flex items-center justify-center gap-2">
                  <svg v-if="!importandoContaAzul" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                  </svg>
                  <svg v-else width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;">
                    <line x1="12" y1="2" x2="12" y2="6"></line>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                    <line x1="4.22" y1="4.22" x2="7.34" y2="7.34"></line>
                    <line x1="16.66" y1="16.66" x2="19.78" y2="19.78"></line>
                    <line x1="2" y1="12" x2="6" y2="12"></line>
                    <line x1="18" y1="12" x2="22" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="7.34" y2="16.66"></line>
                    <line x1="16.66" y1="7.34" x2="19.78" y2="4.22"></line>
                  </svg>
                  {{ importandoContaAzul ? 'Importando...' : 'Importar' }}
                </button>
              </div>
              <p v-if="arquivoContaAzul" class="text-sm text-gray-600 mt-2">
                ✅ Arquivo selecionado: {{ arquivoContaAzul.name }}
              </p>
              <div v-if="mensagemImportacao" class="mt-3 p-3 rounded-lg" :class="importacaoSucesso ? 'bg-green-100 border border-green-300' : 'bg-red-100 border border-red-300'">
                <p :class="importacaoSucesso ? 'text-green-700' : 'text-red-700'" class="text-sm">
                  {{ mensagemImportacao }}
                </p>
              </div>
            </div>

            <!-- Aplicar Regras às Pendentes -->
            <div class="mb-6 pt-4 border-t border-gray-200">
              <p class="text-sm font-semibold text-gray-700 mb-3">Aplicar Regras Automáticas</p>
              <p class="text-xs text-gray-500 mb-3">Categoriza automaticamente notas com fornecedores cadastrados em Regras</p>
              <div class="flex gap-2">
                <button
                  @click="aplicarRegrasAsPendentes"
                  :disabled="aplicandoRegras"
                  class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium text-sm disabled:bg-gray-400 flex items-center justify-center gap-2">
                  <svg v-if="!aplicandoRegras" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline>
                  </svg>
                  <svg v-else width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;">
                    <line x1="12" y1="2" x2="12" y2="6"></line>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                    <line x1="4.22" y1="4.22" x2="7.34" y2="7.34"></line>
                    <line x1="16.66" y1="16.66" x2="19.78" y2="19.78"></line>
                    <line x1="2" y1="12" x2="6" y2="12"></line>
                    <line x1="18" y1="12" x2="22" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="7.34" y2="16.66"></line>
                    <line x1="16.66" y1="7.34" x2="19.78" y2="4.22"></line>
                  </svg>
                  {{ aplicandoRegras ? 'Processando...' : 'Processar Pendentes' }}
                </button>
                <a
                  href="regras-fornecedor.html"
                  target="_self"
                  class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium text-sm text-center flex items-center justify-center gap-2">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="1"></circle>

  <script>
    // Parser de números em formato brasileiro
    function parseBrasilValue(input) {
      if (typeof input === 'number') return input;
      if (typeof input !== 'string') return parseFloat(input);

      let str = input.toString().trim();
      if (str === '' || str === null) return 0;

      if (str.includes('.') && str.includes(',')) {
        str = str.replace(/\./g, '');
        str = str.replace(/,/g, '.');
      } else if (str.includes(',')) {
        str = str.replace(/,/g, '.');
      }

      const result = parseFloat(str);
      return isNaN(result) ? 0 : result;
    }

    // Formatar número para exibição em formato brasileiro
    function formatBrasilValue(value, decimals = 2) {
      if (typeof value !== 'number') value = parseFloat(value);
      if (isNaN(value)) return '0,00';

      const fixed = value.toFixed(decimals);
      const parts = fixed.split('.');
      const intPart = parts[0];
      const decPart = parts[1] || '00';
      const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');

      return `${intFormatted},${decPart}`;
    }

    // Parser inteligente (Conta Azul style)
    function parseValorInteligente(input) {
      let numeros = input.toString().replace(/\D/g, '');
      if (numeros.length === 0) return 0;

      if (numeros.length <= 2) {
        numeros = '0' + numeros.padStart(2, '0');
      }

      const centavos = numeros.slice(-2);
      const reais = numeros.slice(0, -2) || '0';
      const valor = parseFloat(reais + '.' + centavos);

      return valor;
    }

    console.log('✅ Funções de parser carregadas: parseValorInteligente, parseBrasilValue, formatBrasilValue');
  </script>

          if (!bruto || !liquido) return null;

          if (!this.dadosReceitaExtraidos) return null;
          const bruto = parseFloat(this.dadosReceitaExtraidos.valorBruto) || 0;
          const liquido = parseFloat(this.dadosReceitaExtraidos.valorLiquido) || 0;
          if (!bruto || !liquido) return null;
          return bruto - liquido;

          if (!this.plataformaReceita) return this.canaisDeliveryDisponiveis;
          return this.canaisDeliveryDisponiveis.filter(c => c.startsWith(this.plataformaReceita));

          const cats = [...new Set(this.receitas.map(r => r.categoria))];
          return cats.sort();

        receitasFiltradas() {
          return this.receitas.filter(r => {
            const dataOk = r.data >= this.filtroHistorico.dataInicio && r.data <= this.filtroHistorico.dataFim;
            const categoriaOk = !this.filtroHistorico.categoria || r.categoria === this.filtroHistorico.categoria;

          return this.receitasFiltradas.slice(inicio, fim);

          return Math.ceil(this.receitasFiltradas.length / this.paginacao.porPagina);

          if (this.receitasFiltradas.length === 0) return 0;
          return (this.paginacao.paginaAtual - 1) * this.paginacao.porPagina + 1;
        },

        fimRegistro() {
          const fim = this.paginacao.paginaAtual * this.paginacao.porPagina;
          return Math.min(fim, this.receitasFiltradas.length);

        async fazerLogin() {
          try {
            this.loginError = '';
            this.loginLoading = true;

            const response = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: this.loginForm.email,
                senha: this.loginForm.senha
              })
            });

            const resultado = await response.json();

            if (!resultado.success) {
              this.loginError = resultado.error || 'Erro ao fazer login';
              return;
            }

            // Salvar token e usuário
            this.token = resultado.token;
            this.usuario = resultado.usuario;
            this.isAuthenticated = true;
            localStorage.setItem('salon-erp-token', resultado.token);
            localStorage.setItem('salon-erp-usuario', JSON.stringify(resultado.usuario));

            // Limpar formulário
            this.loginForm.email = '';
            this.loginForm.senha = '';

            // Carregar dados
            this.carregarTiposDespesa();
            this.atualizarPeriodo();
            this.carregarNotasPendentes();
          } catch (error) {
            this.loginError = 'Erro ao conectar ao servidor: ' + error.message;
          } finally {
            this.loginLoading = false;
          }
        },

        fazerLogout() {
          this.isAuthenticated = false;

          localStorage.removeItem('salon-erp-token');
          localStorage.removeItem('salon-erp-usuario');
          this.loginForm.email = '';
          this.loginForm.senha = '';
        },

        async analisarCMVInteligente() {
          try {
            console.log('🔍 Gerando análise inteligente CMVAnalyzerV2...');
            this.carregandoAnaliseIA = true;

            if (!this.cmvDados) {
              alert('❌ Carregue os dados de CMV primeiro');
              return;
            }

            // Extrair período em formato YYYY-MM
            const dataInicio = new Date(this.cmvPeriodo.dataInicio);
            const mes = dataInicio.toISOString().slice(0, 7); // "2026-04"

            // Construir input para CMVAnalyzerV2
            const resumo = this.cmvDados.resumo;
            const cmvPorCategoria = {};

            // Montar cmvPorCategoria a partir de cmvDetalhado
            if (this.cmvDados.cmvDetalhado) {
              this.cmvDados.cmvDetalhado.forEach(item => {
                cmvPorCategoria[item.subcategoria] = item.total;
              });
            }

            // Taxas reais da categoria selecionada
            const taxasReais = resumo.totalTaxasReais || 0;
            const receitaLiquida = resumo.totalReceita - taxasReais;

            const payloadV2 = {
              mes: mes,
              restaurante: this.cmvRestauranteSelecionado ? `KAIA - ${this.cmvRestauranteSelecionado}` : 'KAIA - Consolidado',
              receita: {
                bruta: resumo.totalReceita,
                taxas: taxasReais,
                liquida: receitaLiquida
              },
              cmv: {
                sistema: resumo.totalCMV,
                cartaoItau: 0,
                cartaoBradesco: 0,
                total: resumo.totalCMV
              },
              cmvPorCategoria: cmvPorCategoria,
              benchmarks: {
                CMV_META: 22,
                CMV_ALERTA: 25,
                CMV_CRITICO: 30
              }
            };

            console.log('📤 Enviando dados para CMVAnalyzerV2:', payloadV2);

            const response = await fetch(`${window.location.origin}/api/cmv-v2/analisar`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payloadV2)
            });

            const resultado = await response.json();

            if (resultado.success && resultado.analise) {
              // Transformar resposta CMVAnalyzerV2 para formato frontend
              const analiseV2 = resultado.analise;
              this.cmvAnalise = this.transformarAnaliseCMVAnalyzerV2(analiseV2, this.cmvDados);
              console.log('✅ Análise CMVAnalyzerV2 recebida:', this.cmvAnalise);
              console.log('📋 Versão:', resultado.versao);
            } else {
              alert('❌ Erro: ' + (resultado.error || 'Não foi possível gerar análise'));
            }
          } catch (error) {
            console.error('❌ Erro ao analisar CMV:', error);
            alert('Erro ao analisar CMV: ' + error.message);
          } finally {
            this.carregandoAnaliseIA = false;
          }
        },

        transformarAnaliseCMVAnalyzerV2(analiseV2, cmvDados) {
          // Transformar estrutura CMVAnalyzerV2 para estrutura esperada pelo frontend
          const situacao = analiseV2.situacao;
          const problemas = analiseV2.problemas || [];
          const recomendacoes = analiseV2.recomendacoes || [];
          const porCategoria = analiseV2.porCategoria || {};

          // Mapear tipo de problema para emoji
          const emojiProblema = {
            'CMV_ACIMA_META': '📈',
            'DUPLICIDADE_DETECTADA': '🔄',
            'TAXA_PLATAFORMA_ALTA': '💸',
            'ANOMALIA_DADOS': '⚠️'
          };

          // Mapear prioridade de recomendação para emoji
          const emojiRecomendacao = {
            'ALTA': '🔴',
            'MÉDIA': '🟡',
            'BAIXA': '🟢'
          };

          // Converter problemas
          const problemasFormatados = problemas.map(p => ({
            emoji: emojiProblema[p.tipo] || '⚠️',
            tipo: p.tipo,
            descricao: p.descricao,
            impacto: p.impacto,
            severidade: p.severidade
          }));

          // Converter recomendações
          const recomendacoesFormatadas = recomendacoes.map(r => ({
            emoji: emojiRecomendacao[r.prioridade] || '💡',
            acao: r.acao,
            detalhes: r.detalhes,
            prioridade: r.prioridade,
            impacto: r.impacto || ''
          }));

          // Converter porCategoria em subcategoriaAnalise (top 5)
          const subcategoriaAnalise = Object.entries(porCategoria)
            .map(([cat, dados], idx) => ({
              posicao: idx + 1,
              subcategoria: cat,
              total: dados.valor,
              percentualReceita: dados.percentualRL,
              recomendacao: 'Monitorar e buscar otimizações'
            }))
            .slice(0, 5);

          // Calcular variação e status da tendência
          const variacao = parseFloat(analiseV2.cmv.variacao || 0);
          const tendenciaStatus = variacao < 0 ? '📉 Melhorando' : variacao > 0 ? '📈 Piorando' : '➡️ Estável';

          // Calcular impacto financeiro mensal
          const receitaLiquida = analiseV2.receita.liquida;
          const cmvAtual = parseFloat(analiseV2.cmv.percentualRL);
          const cmvIdeal = analiseV2.cmv.meta;
          const diferencaPercentual = cmvAtual - cmvIdeal;
          const impactoFinanceiro = (receitaLiquida * diferencaPercentual) / 100;

          return {
            situacao: {
              cor: situacao.cor,
              descricao: situacao.descricao,
              cmvPercentual: parseFloat(analiseV2.cmv.percentualRL),
              margemBruta: 100 - parseFloat(analiseV2.cmv.percentualRL),
              status: situacao.status,
              meta: analiseV2.cmv.meta
            },
            tendencias: {
              emoji: variacao < 0 ? '📉' : '📈',
              descricao: `CMV variou ${Math.abs(variacao || 0).toFixed(2)}% em relação ao período anterior`,
              status: tendenciaStatus,
              variacao: (variacao || 0).toFixed(2)
            },
            comparacao: {
              avaliacao: `CMV está em ${(cmvAtual || 0).toFixed(2)}%, meta é ${cmvIdeal}%`,
              cmvAtual: (cmvAtual || 0).toFixed(2),
              cmvIdeal: cmvIdeal,
              impactoMensal: {
                diferenca: impactoFinanceiro.toLocaleString('pt-BR', {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2
                })
              }
            },
            problemas: problemasFormatados,
            recomendacoes: recomendacoesFormatadas,
            subcategoriaAnalise: subcategoriaAnalise,
            relatorio: this.gerarRelatorioCMVAnalyzer(analiseV2)
          };
        },

        gerarRelatorioCMVAnalyzer(analise) {
          return `=== ANÁLISE DE CMV — ${analise.mes} ===

📊 SITUAÇÃO: ${analise.situacao.status}
${analise.situacao.descricao}

💰 RECEITA LÍQUIDA: R$ ${(analise.receita.liquida || 0).toFixed(2)}
   (Bruta: R$ ${(analise.receita.bruta || 0).toFixed(2)} - Taxas: R$ ${(analise.receita.taxas || 0).toFixed(2)})

🎯 CMV: R$ ${analise.cmv.total} = ${analise.cmv.percentualRL}% (meta: ${analise.cmv.meta}%)
   Variação: ${analise.cmv.variacao > 0 ? '+' : ''}${analise.cmv.variacao}%

⚠️ PROBLEMAS: ${analise.problemas.length}
${analise.problemas.map(p => `   • ${p.tipo}: ${p.descricao}`).join('\n')}

💡 RECOMENDAÇÕES: ${analise.recomendacoes.length}
${analise.recomendacoes.map(r => `   • [${r.prioridade}] ${r.acao}: ${r.detalhes}`).join('\n')}`;
        },

            });

              const despesasMap = {};

                despesasMap[d.categoria] = d;
              });

              // Mesclar dados: separar taxas e despesas alocadas
              this.statsPorCategoria = stats.map(stat => {
                const despesa = despesasMap[stat.categoria];
                if (despesa) {
                  return {
                    ...stat,
                    totalTaxas: despesa.totalTaxas || 0,
                    totalDespesasAlocadas: despesa.totalDespesasAlocadas || 0,
                    totalDespesa: despesa.totalDespesa,
                    totalLiquido: despesa.totalLiquido,
                    mediaDespesa: despesa.totalDespesa / (stat.dias || 1) // Recalcular média com despesa total
                  };
                }
                return stat;
              });

              console.log('✅ Stats com despesas alocadas:', this.statsPorCategoria);
              this.atualizarFiltroCategoria();

              console.error('❌ API retornou success=false', {
                statsSuccess: response.data.success,
                despesasSuccess: despesasResponse.data.success

          } catch (error) {
            console.error('❌ Erro ao carregar stats por categoria:', error);
            console.error('📋 Detalhes:', error.response?.data || error.message);

        // Verifica se um erro de request é a checagem de duplicidade (HTTP 409 do backend).
        // Se for, mostra os dados do lançamento parecido e pergunta se confirma mesmo assim.
        // Retorna: true (usuário confirmou, pode reenviar com forcarDuplicata) | false (usuário
        // cancelou) | null (não é um erro de duplicidade — quem chamou trata normalmente).
        confirmarApesarDeDuplicata(error) {
          const resp = error.response;
          if (resp?.status !== 409 || !resp?.data?.duplicataDetectada) return null;

          const sim = resp.data.lancamentoSimilar;
          const detalhe = sim
            ? `\n\nLançado em ${new Date(sim.created_at).toLocaleString('pt-BR')}.`
            : '';
          return confirm('⚠️ ' + (resp.data.error || 'Já existe um lançamento parecido.') + detalhe + '\n\nConfirma mesmo assim?');
        },

        async salvarReceita() {
          if (!this.novaReceita.data || !this.novaReceita.total) {
            alert('Preencha todos os campos');
            return;
          }

          // Validar tipo de despesa se for despesa
          if (this.novaReceita.tipo === 'despesa' && !this.novaReceita.tipoDespesaId) {
            alert('Selecione a subcategoria para a despesa');
            return;
          }

          // Validar categoria obrigatória
          if (!this.novaReceita.categoria) {
            alert('Selecione uma categoria');
            return;
          }

          // Se "Outra", validar preenchimento
          if (this.novaReceita.categoria === 'outra' && !this.outraCategoria.trim()) {
            alert('Informe o nome da categoria');
            return;
          }

          const categoria = this.novaReceita.categoria === 'outra'
            ? this.outraCategoria.trim()
            : this.novaReceita.categoria;

          // ✨ Normalizar total: converter formato brasileiro para número
          let totalParaEnviar = this.novaReceita.total;
          if (typeof totalParaEnviar === 'string') {
            // Remove espaços, depois converte: "1.348,32" → "1348.32"
            totalParaEnviar = parseFloat(
              totalParaEnviar
                .replace(/\s/g, '')        // Remove espaços
                .replace(/\./g, '')        // Remove pontos de milhar
                .replace(',', '.')         // Converte vírgula em ponto
            );
          }
          totalParaEnviar = parseFloat(totalParaEnviar);

          const enviar = async (forcarDuplicata) => {
            console.log('📤 Enviando para API:', {
              data: this.novaReceita.data,
              total: totalParaEnviar,
              categoria: categoria,
              tipo_receita: this.novaReceita.tipo,
              forcarDuplicata
            });

            await api.criarFaturamento(
              this.novaReceita.data,
              totalParaEnviar,
              categoria,
              this.novaReceita.tipo,
              this.novaReceita.tipoDespesaId,
              forcarDuplicata
            );
            this.novaReceita.data = getLocalDateISO();
            this.novaReceita.total = null;
            this.novaReceita.categoria = 'Salão';
            this.novaReceita.tipo = 'receita';
            this.novaReceita.classificacao = '';
            this.novaReceita.tipoDespesaId = null;
            this.subcategoriasDisponiveis = [];
            this.outraCategoria = '';

            console.log('✅ [salvarNovaReceita] Lançamento salvo. Recarregando dados...');
            await this.atualizarPeriodo();
            await nextTick();  // Forçar re-render imediato

            // Garantir que o filtro inclua a data do novo lançamento
            const dataNoveLancamento = this.novaReceita.data;
            if (dataNoveLancamento < this.filtroHistorico.dataInicio || dataNoveLancamento > this.filtroHistorico.dataFim) {
              console.warn(`⚠️  [salvarNovaReceita] Data ${dataNoveLancamento} FORA do período [${this.filtroHistorico.dataInicio}, ${this.filtroHistorico.dataFim}]`);
              console.log('🔄 [salvarNovaReceita] Ajustando filtro para incluir nova data...');

              // Se o lançamento é anterior ao período, estender o início
              if (dataNoveLancamento < this.filtroHistorico.dataInicio) {
                this.filtroHistorico.dataInicio = dataNoveLancamento;
              }
              // Se o lançamento é posterior ao período, estender o fim
              if (dataNoveLancamento > this.filtroHistorico.dataFim) {
                this.filtroHistorico.dataFim = dataNoveLancamento;
              }

              console.log(`✅ [salvarNovaReceita] Filtro ajustado: [${this.filtroHistorico.dataInicio}, ${this.filtroHistorico.dataFim}]`);
              await this.atualizarPeriodo();
              await nextTick();  // Forçar re-render imediato
            }

            alert('✅ Lançamento adicionado com sucesso!');
          };

          try {
            await enviar(false);
          } catch (error) {
            const confirmou = this.confirmarApesarDeDuplicata(error);
            if (confirmou === true) {
              try {
                await enviar(true);
              } catch (error2) {
                alert('Erro ao salvar: ' + error2.message);
              }
            } else if (confirmou === null) {
              alert('Erro ao salvar: ' + error.message);
            }
            // confirmou === false: usuário cancelou, não faz nada
          }
        },

        // 🧾 Lançamento por Canal: cria Receita (Bruto) + Despesa (Taxa = Bruto - Líquido) numa transação
        async salvarLancamentoCanal() {
          if (!this.lancamentoCanal.data || !this.lancamentoCanal.canal) {
            alert('❌ Preencha a Data e o Canal');
            return;
          }

          const bruto = parseBrasilValue(this.lancamentoCanal.receitaBruta);
          const liquido = parseBrasilValue(this.lancamentoCanal.receitaLiquida);

          if (!bruto || bruto <= 0) {
            alert('❌ Informe a Receita Bruta');
            return;
          }
          if (!liquido || liquido <= 0) {
            alert('❌ Informe a Receita Líquida');
            return;
          }
          if (liquido > bruto) {
            alert('❌ Receita Líquida não pode ser maior que a Receita Bruta');
            return;
          }

          const enviar = async (forcarDuplicata) => {
            const response = await api.lancarPorCanal(
              this.lancamentoCanal.data,
              this.lancamentoCanal.canal,
              bruto,
              liquido,
              forcarDuplicata
            );

            const taxa = response.data?.data?.taxa ?? (bruto - liquido);
            alert(`✅ Lançamento criado!\n\nCanal: ${this.lancamentoCanal.canal}\nReceita: R$ ${formatBrasilValue(bruto)}\nTaxa: R$ ${formatBrasilValue(taxa)}`);

            // Resetar formulário (mantém a data para facilitar lançamentos em sequência)
            const dataAnterior = this.lancamentoCanal.data;
            this.lancamentoCanal = {
              data: dataAnterior,
              canal: '',
              receitaBruta: '',
              receitaLiquida: ''
            };

            console.log('🔄 [salvarLancamentoCanal] Recarregando dados...');
            await this.atualizarPeriodo();
            await nextTick();
          };

          this.salvandoLancamentoCanal = true;
          try {
            await enviar(false);
          } catch (error) {
            const confirmou = this.confirmarApesarDeDuplicata(error);
            if (confirmou === true) {
              try {
                await enviar(true);
              } catch (error2) {
                console.error('❌ Erro ao lançar por canal:', error2);
                const erroApi2 = error2.response?.data?.error;
                alert('❌ Erro ao lançar: ' + ((erroApi2 && typeof erroApi2 === 'object' ? erroApi2.message : erroApi2) || error2.message));
              }
            } else if (confirmou === null) {
              console.error('❌ Erro ao lançar por canal:', error);
              const erroApi = error.response?.data?.error;
              const mensagem = (erroApi && typeof erroApi === 'object' ? erroApi.message : erroApi) || error.message;
              alert('❌ Erro ao lançar: ' + mensagem);
            }
            // confirmou === false: usuário cancelou, não faz nada
          } finally {
            this.salvandoLancamentoCanal = false;
          }
        },

        // Formatar valor genérico (estilo Conta Azul - inteligente), usado no Lançamento por Canal
        formatarValorGenerico($event, objeto, campo) {
          let valor = $event.target.value;
          if (!valor) return;

          const apenasNumeros = valor.toString().replace(/\D/g, '');
          const temPonto = valor.toString().includes('.');
          const temVirgula = valor.toString().includes(',');
          const temVirgulaNoPenultimo = /,\d{2}$/.test(valor.toString());

          let parsedValue;
          if ((temPonto && temVirgula) || (temVirgula && temVirgulaNoPenultimo)) {
            let limpo = valor.toString().replace(/[^0-9.,]/g, '');
            parsedValue = parseBrasilValue(limpo);
          } else {
            parsedValue = parseValorInteligente(apenasNumeros);
          }

          if (!isNaN(parsedValue) && parsedValue > 0) {
            objeto[campo] = formatBrasilValue(parsedValue);
          }
        },

        abrirEdicao(receita) {
          // ✅ Garantir que data está no formato YYYY-MM-DD para o input[type=date]
          let dataFormatada = receita.data;

          // Se data é timestamp ISO (ex: 2026-04-07T00:00:00Z), extrair apenas YYYY-MM-DD
          if (dataFormatada && typeof dataFormatada === 'string' && dataFormatada.includes('T')) {
            dataFormatada = dataFormatada.split('T')[0];
          }

          this.receitaEmEdicao = {
            id: receita.id,
            data: dataFormatada,
            total: parseFloat(receita.total) || 0,
            categoria: receita.categoria,
            tipo: receita.tipo,
            tipoDespesaId: receita.tipo_despesa_id || null  // Carregar tipo_despesa_id atual
          };
          this.mostrarModalEdicao = true;
          this.menuAcoesAberto = null;
        },

        async salvarEdicao() {
          try {
            // ✅ Validações robustas
            if (!this.receitaEmEdicao.data || !this.receitaEmEdicao.data.trim()) {
              alert('❌ Data é obrigatória');
              return;
            }

            // ✨ Normalizar total: suporta múltiplos formatos
            // - Números puros: "841133" → 8411.33
            // - Formato brasileiro: "8.411,33" → 8411.33
            // - Sem separadores: "8411,33" → 8411.33
            let totalNormalizado;
            const apenasNumeros = this.receitaEmEdicao.total.toString().replace(/\D/g, '');
            const temSeparadores = /[.,]/.test(this.receitaEmEdicao.total.toString());

            // Se é SÓ NÚMEROS (puro), usar parser inteligente
            if (apenasNumeros.length > 0 && !temSeparadores) {
              totalNormalizado = parseValorInteligente(apenasNumeros);
            }
            // Se tem separadores, usar parser brasileiro
            else {
              let limpo = this.receitaEmEdicao.total.toString().replace(/[^0-9.,]/g, '');
              totalNormalizado = parseBrasilValue(limpo);
            }

            if (!totalNormalizado || totalNormalizado <= 0) {
              alert('❌ Total deve ser maior que zero');
              return;
            }

            if (!this.receitaEmEdicao.categoria || !this.receitaEmEdicao.categoria.trim()) {
              alert('❌ Categoria é obrigatória');
              return;
            }

            if (!this.receitaEmEdicao.tipo || !this.receitaEmEdicao.tipo.trim()) {
              alert('❌ Tipo (Receita/Despesa) é obrigatório');
              return;
            }

            // Validar formato de data (YYYY-MM-DD)
            if (!/^\d{4}-\d{2}-\d{2}$/.test(this.receitaEmEdicao.data)) {
              alert('❌ Data em formato inválido. Use DD/MM/YYYY');

        formatarData(data) {
          // ✅ Validar data antes de processar
          if (!data || typeof data !== 'string') {
            // Fallback: retornar hoje em formato brasileiro se data inválida
            const hoje = new Date();
            return hoje.toLocaleDateString('pt-BR', {
              weekday: 'short',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit'
            });
          }

          // Handle ISO timestamps (2026-04-15T00:00:00.000Z) by extracting just the date part
          if (data.includes('T')) {
            data = data.split('T')[0];
          }

          try {
            // Parse data LOCAL (YYYY-MM-DD) sem conversão UTC
            const [year, month, day] = data.split('-');

            // Validar se temos ano, mês e dia válidos
            if (!year || !month || !day || isNaN(year) || isNaN(month) || isNaN(day)) {
              throw new Error('Data inválida');
            }

            const dataLocal = new Date(year, month - 1, day);

            // Validar se a data é válida
            if (isNaN(dataLocal.getTime())) {
              throw new Error('Data inválida');
            }

            // Formatar com barras para garantir consistência
            const dia = String(dataLocal.getDate()).padStart(2, '0');
            const mes = String(dataLocal.getMonth() + 1).padStart(2, '0');
            const ano = dataLocal.getFullYear();
            const diasSemana = ['dom.', 'seg.', 'ter.', 'qua.', 'qui.', 'sex.', 'sáb.'];
            const diaSemana = diasSemana[dataLocal.getDay()];

            return `${diaSemana}, ${dia}/${mes}/${ano}`;
          } catch (err) {
            // Fallback: retornar hoje se houver erro no parse
            console.warn('⚠️ Erro ao formatar data:', data, err.message);
            const hoje = new Date();
            return hoje.toLocaleDateString('pt-BR', {
              weekday: 'short',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit'
            });
          }
        },

        exportarCSV() {
          if (this.notasPendentes.length === 0) {
            alert('❌ Nenhuma nota para exportar');
            return;
          }

          try {
            console.log('📊 Gerando CSV...');

            // Cabeçalhos
            const headers = ['Data', 'Número NF', 'Fornecedor', 'Descrição', 'Valor', 'Classificação', 'Status'];

            // Dados das notas
            const rows = this.notasPendentes.map(nota => [
              nota.data_emissao || 'N/A',
              nota.numero_nf || 'N/A',
              nota.fornecedor_nome || 'N/A',
              nota.descricao || 'N/A',
              parseFloat(nota.valor_total || 0).toFixed(2),
              nota.classificacao_sugerida || 'N/A',
              nota.status || 'N/A'
            ]);

            // Montar CSV
            let csv = headers.map(h => `"${h}"`).join(',') + '\n';
            csv += rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');

            // Criar blob e download
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', `notas-fiscais-${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            console.log('✅ CSV exportado com sucesso');
            alert(`✅ CSV exportado com ${this.notasPendentes.length} nota(s)`);
          } catch (error) {
            console.error('❌ Erro ao exportar CSV:', error);
            alert('❌ Erro ao exportar CSV');
          }
        },

            reader.readAsDataURL(file);
          });

        // Confirma os dados extraídos e lança Receita (Bruto) + Despesa (Taxa) via lancamento-canal
        async salvarReceitaExtraida() {
          if (!this.dadosReceitaExtraidos.canal) {
            alert('❌ Selecione o canal (a foto não deixou claro qual é)');
            return;
          }
          if (!this.dadosReceitaExtraidos.valorBruto || parseFloat(this.dadosReceitaExtraidos.valorBruto) <= 0) {
            alert('❌ Informe a Receita Bruta');
            return;
          }
          if (!this.dadosReceitaExtraidos.valorLiquido || parseFloat(this.dadosReceitaExtraidos.valorLiquido) <= 0) {
            alert('❌ Informe a Receita Líquida');
            return;
          }
          if (parseFloat(this.dadosReceitaExtraidos.valorLiquido) > parseFloat(this.dadosReceitaExtraidos.valorBruto)) {
            alert('❌ Receita Líquida não pode ser maior que a Receita Bruta');
            return;
          }

          const enviar = async (forcarDuplicata) => {
            await api.lancarPorCanal(
              this.dadosReceitaExtraidos.data,
              this.dadosReceitaExtraidos.canal,
              this.dadosReceitaExtraidos.valorBruto,
              this.dadosReceitaExtraidos.valorLiquido,
              forcarDuplicata
            );

            this.receitaImagemSalva = true;
            this.dadosReceitaExtraidos = null;

            setTimeout(() => {
              this.receitaImagemSalva = false;
            }, 3000);

            await this.atualizarPeriodo();
          };

          this.salvandoReceitaImagem = true;
          try {
            await enviar(false);
          } catch (error) {
            const confirmou = this.confirmarApesarDeDuplicata(error);
            if (confirmou === true) {
              try {
                await enviar(true);
              } catch (error2) {
                console.error('❌ Erro ao salvar receita:', error2);
                const erroApi2 = error2.response?.data?.error;
                alert('❌ Erro ao salvar: ' + ((erroApi2 && typeof erroApi2 === 'object' ? erroApi2.message : erroApi2) || error2.message));
              }
            } else if (confirmou === null) {
              console.error('❌ Erro ao salvar receita:', error);
              const erroApi = error.response?.data?.error;
              const mensagem = (erroApi && typeof erroApi === 'object' ? erroApi.message : erroApi) || error.message;
              alert('❌ Erro ao salvar: ' + mensagem);
            }
            // confirmou === false: usuário cancelou, não faz nada
          } finally {
            this.salvandoReceitaImagem = false;
          }
        },
